name: Bepack pack check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit of the official v4.4.0 tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Pinned to the commit of the official v4.4.0 tag.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run offline tool tests
        run: npm test
      - name: Validate the template project offline
        run: node scripts/bepack.mjs validate --project . --report validation-report.json
      # Pinned to the commit of the official v4.6.2 tag.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-report-${{ github.run_id }}
          path: validation-report.json
          if-no-files-found: error
          retention-days: 7
